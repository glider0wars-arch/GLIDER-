<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLIDER WAR</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff8ec;
    --text: #2a1a08;
    --accent: #ff8c00;
    --accent2: #ffcc33;
    --panel: #fff0d6;
    --shadow: rgba(255, 140, 0, 0.35);
  }
  body.dark {
    --bg: #0d0904;
    --text: #ffe9c2;
    --accent: #ff9d1f;
    --accent2: #ffd54a;
    --panel: #1a1208;
    --shadow: rgba(255, 157, 31, 0.45);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    transition: background 0.4s ease, color 0.4s ease;
    min-height: 100vh;
  }

  .toggle-btn {
    position: fixed;
    top: 8px;
    left: 8px;
    background: var(--panel);
    color: var(--accent);
    border: 2px solid var(--accent);
    border-radius: 50%;
    width: 30px;
    height: 30px;
    font-size: 0.85rem;
    cursor: pointer;
    z-index: 10;
    box-shadow: 0 0 10px var(--shadow);
    transition: transform 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .toggle-btn:hover { transform: rotate(20deg) scale(1.05); }

  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 40px 20px 20px;
  }

  .hero img {
    width: min(340px, 80vw);
    height: min(340px, 80vw);
    object-fit: cover;
    border-radius: 20px;
    border: 3px solid var(--accent);
    box-shadow: 0 0 40px var(--shadow);
  }

  .title-en {
    font-family: 'Cinzel Decorative', serif;
    font-weight: 900;
    font-size: clamp(2.2rem, 8vw, 4.2rem);
    letter-spacing: 6px;
    margin: 28px 0 4px;
    background: linear-gradient(180deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 4px 20px var(--shadow);
  }

  .divider {
    width: 120px;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    margin: 10px 0 30px;
  }

  .description {
    max-width: 760px;
    margin: 0 auto 60px;
    padding: 0 20px;
    line-height: 2;
    font-size: 1.05rem;
  }

  .description p {
    margin-bottom: 22px;
    color: var(--text);
    opacity: 0.92;
  }

  .description p:last-child {
    font-weight: 700;
    color: var(--accent);
    opacity: 1;
  }

  .bg-glow {
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(circle at 20% 10%, var(--shadow), transparent 40%),
      radial-gradient(circle at 80% 30%, var(--shadow), transparent 35%);
    opacity: 0.5;
    pointer-events: none;
  }

  .join-btn-wrap {
    display: flex;
    justify-content: center;
    padding-bottom: 60px;
  }

  .join-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #1a0f00;
    text-decoration: none;
    font-weight: 700;
    font-size: 1.1rem;
    padding: 14px 42px;
    border-radius: 50px;
    box-shadow: 0 0 25px var(--shadow);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    display: inline-block;
  }
  .join-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 40px var(--shadow);
  }

  .menu-btn {
    position: fixed;
    top: 8px;
    right: 8px;
    background: var(--panel);
    color: var(--accent);
    border: 2px solid var(--accent);
    border-radius: 50%;
    width: 30px;
    height: 30px;
    font-size: 0.9rem;
    cursor: pointer;
    z-index: 20;
    box-shadow: 0 0 10px var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .menu-panel {
    position: fixed;
    top: 46px;
    right: 8px;
    background: var(--panel);
    border: 2px solid var(--accent);
    border-radius: 14px;
    box-shadow: 0 0 25px var(--shadow);
    z-index: 20;
    overflow: hidden;
    min-width: 150px;
    display: none;
    flex-direction: column;
  }
  .menu-panel.open { display: flex; }

  .menu-panel button {
    background: none;
    border: none;
    color: var(--text);
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    font-size: 0.95rem;
    padding: 14px 18px;
    text-align: right;
    cursor: pointer;
    border-bottom: 1px solid var(--shadow);
  }
  .menu-panel button:last-child { border-bottom: none; }
  .menu-panel button:hover { background: var(--shadow); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 30;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }

  .modal-box {
    background: var(--panel);
    border: 2px solid var(--accent);
    border-radius: 18px;
    padding: 30px 24px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 40px var(--shadow);
  }

  .modal-box h3 {
    margin-top: 0;
    color: var(--accent);
    font-family: 'Vazirmatn', Tahoma, sans-serif;
  }

  .stars {
    display: flex;
    justify-content: center;
    gap: 8px;
    font-size: 2.2rem;
    margin: 20px 0;
    direction: ltr;
  }
  .stars span {
    cursor: pointer;
    color: var(--shadow);
    transition: color 0.15s ease, transform 0.15s ease;
  }
  .stars span.filled {
    color: var(--accent);
    transform: scale(1.1);
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 10px;
  }

  .modal-actions button {
    border: none;
    border-radius: 30px;
    padding: 10px 24px;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    font-weight: 700;
    cursor: pointer;
  }
  .submit-btn {
    background: var(--accent);
    color: #1a0f00;
  }
  .close-btn {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--text) !important;
  }

  .thanks-msg {
    color: var(--accent);
    font-weight: 700;
    display: none;
  }
</style>
</head>

  <button class="menu-btn" id="menuToggle">&#9776;</button>
  <div class="menu-panel" id="menuPanel">
    <button id="homeBtn">خانه</button>
    <button id="manageBtn">مدیریت</button>
    <button id="rateBtn">نظردهی</button>
